server.port=8080

spring.application.name=smart-library-book-issue-return-management-system

spring.datasource.url=jdbc:mysql://localhost:3306/library_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=CHANGE_ME_DB_USERNAME
spring.datasource.password=CHANGE_ME_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.librarymanagement=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

jwt.secret=CHANGE_ME_TO_A_RANDOM_64_CHARACTER_MINIMUM_SECRET_FOR_HS256_SIGNING_KEY!!
jwt.expiration=86400000
